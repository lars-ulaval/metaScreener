# metaScreener CI - test matrix workflow
#
# Runs the test suite + audit tools across a 16-cell matrix:
#   {ubuntu-22.04, ubuntu-24.04, macos-14, windows-latest}
#   x {3.10, 3.11, 3.12, 3.13}
#
# Public-repository GitHub Actions minutes are unlimited; this is fine
# as long as metaScreener stays public. For a fork in a private repo
# with constrained minutes, drop to a 6-cell matrix:
#   {ubuntu-22.04, macos-14, windows-latest} x {3.10, 3.13}
# and document the reduction here.
#
# No mojibake sweep in this workflow: that's a Windows-PowerShell
# pattern (Select-String -Pattern 'Latin1-mojibake-marks') that
# doesn't translate cleanly to bash. Mojibake protection lives in the
# local pre-commit gates only.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests/ -q

      - name: Audit imports (plugins + tests)
        run: python tools/audit_imports.py plugins/ tests/

      - name: Audit decorators (plugins + tests)
        run: python tools/audit_decorators.py plugins/ tests/
