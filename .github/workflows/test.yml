# metaScreener CI - test matrix workflow
#
# Runs the test suite + audit tools across a 16-cell matrix:
#   {ubuntu-22.04, ubuntu-24.04, macos-14, windows-latest}
#   x {3.10, 3.11, 3.12, 3.13}
#
# Public-repository GitHub Actions minutes are unlimited; this is fine
# as long as metaScreener stays public. For a fork in a private repo
# with constrained minutes, drop to a 6-cell matrix:
#   {ubuntu-22.04, macos-14, windows-latest} x {3.10, 3.13}
# and document the reduction here.
#
# Encoding is checked here, not only locally. It used to be a
# Windows-PowerShell pattern that didn't translate to bash, so it lived
# in the local pre-commit gates alone - and it failed to hold: commit
# 365325c reintroduced a UTF-8 BOM and mojibake on 46 lines of README.md
# while changing one character of a DOI. tools/check_encoding.py is pure
# Python and runs identically on all four runners.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests/ -q

      - name: Audit imports (plugins + tests)
        run: python tools/audit_imports.py plugins/ tests/

      - name: Audit decorators (plugins + tests)
        run: python tools/audit_decorators.py plugins/ tests/

      - name: Check encoding (no BOMs, no mojibake)
        run: python tools/check_encoding.py
